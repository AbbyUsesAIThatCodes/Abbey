name: Native desktop builds
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, test, and package
        run: python scripts/build.py --desktop --package --jobs 4
      - name: Record simulation benchmark
        shell: bash
        run: |
          if [ -f build/Release/abbey_benchmark.exe ]; then
            build/Release/abbey_benchmark.exe > docs/benchmark-ci.csv
          else
            build/abbey_benchmark > docs/benchmark-ci.csv
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Abbey-${{ matrix.os }}
          path: |
            dist/*.zip
            docs/benchmark-ci.csv
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-sanitize -DABBEY_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build-sanitize --parallel 4
      - run: ctest --test-dir build-sanitize --output-on-failure
